receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  filelog/squid:
    include:
      - /var/log/squid/*.log
    start_at: beginning
    storage: file_storage

extensions:
  file_storage:
    directory: /var/lib/otelcol

processors:
  batch:
  resource/squid:
    attributes:
      - key: service.name
        value: sand-http-cache
        action: upsert

exporters:
  otlp/tempo:
    endpoint: tempo.dev.local:4317
    tls:
      insecure: true

  otlphttp/loki:
    endpoint: http://loki.dev.local:3100/otlp
    tls:
      insecure: true

service:
  extensions: [file_storage]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/tempo]

    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/loki]

    logs/squid:
      receivers: [filelog/squid]
      processors: [resource/squid, batch]
      exporters: [otlphttp/loki]
