name: Build and Publish Sandbox Images

on:
  push:
    branches:
      - main
    paths:
      - 'images/**'
      - '.github/workflows/publish-sandbox-image.yml'
  pull_request:
    paths:
      - 'images/**'
      - '.github/workflows/publish-sandbox-image.yml'
  # Fires once the Release workflow (.github/workflows/release.yml) has
  # published a GitHub Release, i.e. after goreleaser has uploaded the
  # matching innie_linux_*.tar.gz assets that the Dockerfile below downloads.
  # Triggering on tag-push instead would race those uploads.
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      sand_cli_version:
        description: >-
          sand CLI release tag to (re-)publish the image under, e.g. v0.1.5.
          Set this to rebuild and overwrite an existing version's image (for
          image-only fixes that don't need a new CLI release); leave blank
          for an untagged test build using the fallback version below.
        required: false

env:
  REGISTRY: ghcr.io
  # Fallback only, used for workflow_dispatch/branch/PR builds that don't
  # name a release explicitly. Release-triggered builds always use the
  # published release's own tag instead, so the image version matches the
  # container-side sand CLI baked into it.
  FALLBACK_SAND_CLI_VERSION: v0.1.4

jobs:
  build-and-push-base:
    env:
      IMAGE_NAME: banksean/sand/base
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine sand CLI version to bake in
        id: cli_version
        run: |
          # tag_version=true means this run should (re-)publish the
          # ghcr.io/.../base:<version> tag itself, not just latest/branch/sha
          # tags. That only makes sense when a version was named explicitly:
          # either by the release event, or by an operator manually
          # re-publishing an existing version's image (e.g. after an
          # image-only fix that doesn't warrant a new sand CLI release).
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "version=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
            echo "tag_version=true" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.inputs.sand_cli_version }}" ]; then
            echo "version=${{ github.event.inputs.sand_cli_version }}" >> "$GITHUB_OUTPUT"
            echo "tag_version=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ env.FALLBACK_SAND_CLI_VERSION }}" >> "$GITHUB_OUTPUT"
            echo "tag_version=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-,enable=${{ github.ref_type == 'branch' }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.cli_version.outputs.version }},enable=${{ steps.cli_version.outputs.tag_version == 'true' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./images/base
          file: ./images/base/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            SAND_CLI_VERSION=${{ steps.cli_version.outputs.version }}
            TZ=UTC
